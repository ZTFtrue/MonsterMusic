AutoName: MonsterMusic
Summary: Modern local music player with native C DSP engine, equalizer, and synced lyrics
Description: |-
  MonsterMusic is an open-source, private, and customizable local music player for Android.

  Key Features:
  • Native C DSP Audio Engine: Low-latency audio processing powered by high-performance native C.
  • Dual Filter Architectures: High-precision Biquad IIR filters & 2048-tap linear-phase FFT FIR filters with master soft limiter.
  • Studio Audio Effects: Stereo Delay with ping-pong feedback, Reverb, Chorus, Flanger, Polyphony, and Stereo Widening, each with dedicated Dry/Wet mix blending.
  • Audio Processing Chain Inspector: Real-time audio signal flow visualization below cover art (input stream details, decoder, resampler, DSP filter mode, and audio sink).
  • Dynamic Audio Visualizers: Matrix Digital Rain and 32-band Audio Spectrum visualizers with frequency reactivity, fullscreen mode, and landscape orientation lock.
  • Dual Pitch & Speed Controls: Coarse (0.1x) and fine-tuning (0.01x) sliders for tempo and pitch stretching.
  • Interactive Synced Lyrics: Smooth auto-scrolling, drag-to-seek timestamp navigation, and tap-to-lookup dictionary popup with multi-dictionary support.
  • Privacy First: 100% offline, zero network requests, no analytics, and no intrusive permissions.

